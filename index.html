<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="Idon Kudi: an offline money assistant for blind and low-vision Nigerians.">
  <title>Idon Kudi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <h1 id="appName">Idon Kudi</h1>
    <p id="tagline">Your eye for money</p>
    <div class="row">
      <label for="lang" id="langLabel">Language</label>
      <select id="lang">
        <option value="en">English</option>
        <option value="ha">Hausa</option>
      </select>
    </div>
    <label class="check">
      <input type="checkbox" id="srMode">
      <span id="srLabel">I use a screen reader (the app will not speak aloud)</span>
    </label>
  </header>

  <nav aria-label="Main" id="tabs" role="tablist">
    <button role="tab" id="tab-notes" aria-controls="panel-notes" aria-selected="true">Notes</button>
    <button role="tab" id="tab-alerts" aria-controls="panel-alerts" aria-selected="false" tabindex="-1">Alerts</button>
    <button role="tab" id="tab-transfer" aria-controls="panel-transfer" aria-selected="false" tabindex="-1">Transfer</button>
    <button role="tab" id="tab-teach" aria-controls="panel-teach" aria-selected="false" tabindex="-1">Teach</button>
  </nav>

  <main id="main" tabindex="-1">
    <!-- The one live region everything announces through. TalkBack/VoiceOver read it. -->
    <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- The camera is shared by the Notes and Teach tabs. -->
    <div class="camera" id="cameraBox" hidden>
      <video id="video" playsinline muted aria-hidden="true"></video>
      <canvas id="canvas" hidden></canvas>
    </div>

    <section role="tabpanel" id="panel-notes" aria-labelledby="tab-notes">
      <p id="notesIntro"></p>
      <button class="big primary" id="scanBtn"></button>
      <button class="big" id="torchBtn" hidden></button>
    </section>

    <section role="tabpanel" id="panel-alerts" aria-labelledby="tab-alerts" hidden>
      <p id="alertsIntro"></p>
      <label for="alertSender" id="alertSenderLabel"></label>
      <input id="alertSender" type="text" autocomplete="off">
      <label for="alertText" id="alertTextLabel"></label>
      <textarea id="alertText" rows="5"></textarea>
      <button class="big" id="alertPaste"></button>
      <button class="big primary" id="alertCheck"></button>
    </section>

    <section role="tabpanel" id="panel-transfer" aria-labelledby="tab-transfer" hidden>
      <p id="transferIntro"></p>
      <label for="tfAmount" id="tfAmountLabel"></label>
      <div class="row">
        <input id="tfAmount" type="text" inputmode="text" autocomplete="off">
        <button class="mic" id="tfAmountMic" hidden></button>
      </div>
      <label for="tfAccount" id="tfAccountLabel"></label>
      <div class="row">
        <input id="tfAccount" type="text" inputmode="numeric" autocomplete="off">
        <button class="mic" id="tfAccountMic" hidden></button>
      </div>
      <label for="tfBank" id="tfBankLabel"></label>
      <input id="tfBank" type="text" autocomplete="off">
      <button class="big primary" id="tfCheck"></button>
      <div id="tfConfirmBox" hidden>
        <button class="big primary" id="tfConfirm"></button>
        <button class="big danger" id="tfCancel"></button>
      </div>
    </section>

    <section role="tabpanel" id="panel-teach" aria-labelledby="tab-teach" hidden>
      <p id="teachIntro"></p>
      <button class="big" id="camBtn"></button>
      <label for="denom" id="denomLabel"></label>
      <select id="denom"></select>
      <button class="big primary" id="captureBtn"></button>
      <h2 id="countsHead"></h2>
      <ul id="counts"></ul>
      <button class="big" id="evalBtn"></button>
      <button class="big" id="exportBtn"></button>
      <label class="filebtn big" id="importLabel">
        <span id="importText"></span>
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
      <button class="big danger" id="clearBtn"></button>
      <p class="small" id="teachPrivacy"></p>
    </section>

    <output id="result" class="result" aria-live="off"></output>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
